name: Archivi.ng Historical Scraper

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Newspaper source'
        required: true
        type: choice
        options:
          - pm-news
          - nigeria-magazine
      start_year:
        description: 'Start year (e.g., 1960)'
        required: true
        type: string
      end_year:
        description: 'End year (e.g., 2010). Same as start for single year.'
        required: true
        type: string
      limit:
        description: 'Max pages per year'
        required: false
        default: '100'
        type: string
      use_ocr:
        description: 'Use Claude Vision OCR for text extraction'
        required: false
        default: false
        type: boolean

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours for multi-year scraping

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'decide9ja_backend/requirements.txt'

      - name: Install dependencies
        run: |
          cd decide9ja_backend
          pip install -r requirements.txt

      - name: Run archivi.ng scraper
        run: |
          cd decide9ja_backend
          python scripts/scrape_archiving_full.py \
            --source ${{ inputs.source }} \
            --start ${{ inputs.start_year }} \
            --end ${{ inputs.end_year }} \
            --limit ${{ inputs.limit }} \
            ${{ inputs.use_ocr == true && '--ocr' || '' }}

      - name: Report results
        if: always()
        run: |
          echo "::notice::Archivi.ng scrape for ${{ inputs.source }} ${{ inputs.start_year }}-${{ inputs.end_year }} completed"
