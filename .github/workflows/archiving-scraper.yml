name: Archivi.ng Historical Scraper

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Newspaper source'
        required: true
        type: choice
        options:
          - pm-news
          - nigeria-magazine
      year:
        description: 'Year to scrape (1960-2010 for PM News)'
        required: true
        type: string
      month:
        description: 'Month (1-12, or empty for whole year)'
        required: false
        type: string
      limit:
        description: 'Max pages to scrape'
        required: false
        default: '100'
        type: string
      use_ocr:
        description: 'Use Claude Vision OCR for text extraction'
        required: false
        default: false
        type: boolean

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hours for OCR-heavy scraping

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'decide9ja_backend/requirements.txt'

      - name: Install dependencies
        run: |
          cd decide9ja_backend
          pip install -r requirements.txt

      - name: Run archivi.ng scraper
        run: |
          cd decide9ja_backend
          python -c "
          import asyncio
          import logging
          logging.basicConfig(level=logging.INFO)

          from app.services.archiving_scraper import ArchiviNgScraper, store_scraped_pages, NewspaperPage

          async def run():
              scraper = ArchiviNgScraper()
              try:
                  source = '${{ inputs.source }}'
                  year = int('${{ inputs.year }}')
                  limit = int('${{ inputs.limit }}')
                  use_ocr = '${{ inputs.use_ocr }}' == 'true'
                  month_input = '${{ inputs.month }}'

                  print(f'Scraping archivi.ng: {source} for {year}')
                  print(f'OCR enabled: {use_ocr}')
                  print(f'Limit: {limit} pages')

                  if month_input and month_input.strip():
                      month = int(month_input)
                      print(f'Month filter: {month}')
                      # Scrape specific month by iterating days
                      all_pages = []
                      for day in range(1, 32):
                          try:
                              edition = await scraper.scrape_date(
                                  source, year, month, day, use_ocr=use_ocr
                              )
                              if edition:
                                  all_pages.extend(edition.pages)
                              if len(all_pages) >= limit:
                                  break
                          except Exception as e:
                              print(f'Day {day} error: {e}')
                      result = {
                          'source': source,
                          'year': year,
                          'month': month,
                          'pages_scraped': len(all_pages),
                          'pages': [p.to_dict() for p in all_pages]
                      }
                  else:
                      result = await scraper.scrape_year(
                          source, year, limit, use_ocr=use_ocr
                      )

                  print(f'\\nScrape complete!')
                  print(f'Pages scraped: {result.get(\"pages_scraped\", 0)}')
                  print(f'Politicians found: {result.get(\"politicians_found\", [])[:20]}')

                  # Store in database
                  if result.get('pages'):
                      pages = [NewspaperPage(**p) for p in result['pages']]
                      stored = await store_scraped_pages(pages)
                      print(f'Stored in database: {stored}')

              finally:
                  await scraper.close()

          asyncio.run(run())
          "

      - name: Report results
        if: always()
        run: |
          echo "::notice::Archivi.ng scrape for ${{ inputs.source }} ${{ inputs.year }} completed"
