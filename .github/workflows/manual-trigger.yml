name: Manual Job Runner

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        type: choice
        options:
          - news
          - index
          - issues
          - dossiers
          - cards
          - cleanup
          - seed_politicians
          - all

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  run-job:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'decide9ja_backend/requirements.txt'

      - name: Install dependencies
        run: |
          cd decide9ja_backend
          pip install -r requirements.txt

      - name: Run selected job
        run: |
          cd decide9ja_backend
          if [ "${{ inputs.job }}" = "seed_politicians" ]; then
            python scripts/seed_politicians.py
          else
            python -m app.scheduler_unified --job ${{ inputs.job }}
          fi

      - name: Report results
        if: always()
        run: |
          echo "::notice::Job '${{ inputs.job }}' completed"
