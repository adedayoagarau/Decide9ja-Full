name: Politician Seeder

on:
  schedule:
    # Weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  seed-politicians:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'decide9ja_backend/requirements.txt'

      - name: Install dependencies
        run: |
          cd decide9ja_backend
          pip install -r requirements.txt

      - name: Seed politicians database
        run: |
          cd decide9ja_backend
          python scripts/seed_politicians.py

      - name: Report results
        if: always()
        run: |
          echo "::notice::Politician seeding job completed"
