[pytest]
# Pytest configuration for Decide9ja Backend

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
addopts = -v --tb=short --strict-markers -ra

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    slow: Slow tests (skip with -m "not slow")
    api: API endpoint tests
    auth: Authentication/authorization tests
    broadcast: Broadcast service tests
    factcheck: Fact-checking tests
    constituency: Constituency/community tests
    whatsapp: WhatsApp integration tests

# Async settings
asyncio_mode = auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (if pytest-cov is installed)
# Run with: pytest --cov=app --cov-report=html

# Timeout for individual tests (in seconds)
timeout = 30
