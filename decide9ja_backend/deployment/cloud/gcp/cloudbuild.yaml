# Decide9ja GCP Cloud Build Configuration
# Builds and deploys scheduler to Cloud Run
#
# Trigger: Push to main branch
# Services deployed:
#   - decide9ja-scheduler (Cloud Run Job)
#   - decide9ja-news-worker (Cloud Run Service)

steps:
  # Build the scheduler image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/decide9ja-scheduler:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/decide9ja-scheduler:latest'
      - '-f'
      - 'deployment/docker/Dockerfile.scheduler'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/decide9ja-scheduler:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/decide9ja-scheduler:latest'

  # Deploy Cloud Run Job for scheduled tasks
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'decide9ja-scheduler'
      - '--image'
      - 'gcr.io/$PROJECT_ID/decide9ja-scheduler:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--max-retries'
      - '3'
      - '--task-timeout'
      - '3600s'
      - '--set-env-vars'
      - 'DATABASE_URL=$_DATABASE_URL,REDIS_URL=$_REDIS_URL'
      - '--set-secrets'
      - 'ANTHROPIC_API_KEY=anthropic-api-key:latest,OPENAI_API_KEY=openai-api-key:latest'

  # Deploy Cloud Run Service for continuous worker
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'decide9ja-news-worker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/decide9ja-scheduler:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '0.5'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '1'
      - '--no-allow-unauthenticated'
      - '--command'
      - 'python,-m,app.services.news_agent,--worker,--interval,300'
      - '--set-env-vars'
      - 'DATABASE_URL=$_DATABASE_URL,REDIS_URL=$_REDIS_URL'
      - '--set-secrets'
      - 'ANTHROPIC_API_KEY=anthropic-api-key:latest,OPENAI_API_KEY=openai-api-key:latest'

  # Create Cloud Scheduler jobs
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # News scraper - every hour
        gcloud scheduler jobs create http decide9ja-news-scraper \
          --location=$_REGION \
          --schedule="0 * * * *" \
          --uri="https://$_REGION-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/$PROJECT_ID/jobs/decide9ja-scheduler:run" \
          --http-method=POST \
          --oauth-service-account-email=$_SERVICE_ACCOUNT \
          --attempt-deadline=3600s \
          --description="Run news scraper hourly" \
          || gcloud scheduler jobs update http decide9ja-news-scraper \
            --location=$_REGION \
            --schedule="0 * * * *"

substitutions:
  _REGION: europe-west1
  _DATABASE_URL: '' # Set via Cloud Build trigger
  _REDIS_URL: ''    # Set via Cloud Build trigger
  _SERVICE_ACCOUNT: '' # Set via Cloud Build trigger

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/decide9ja-scheduler:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/decide9ja-scheduler:latest'
